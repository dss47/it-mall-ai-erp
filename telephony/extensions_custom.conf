[ai-hotline]
exten => s,1,Answer()
 same => n,Set(US=${RAND(10000000,99999999)}-${RAND(1000,9999)}-4${RAND(100,999)}-${RAND(1000,9999)}-${RAND(100000,999999)}${RAND(100000,999999)})
 same => n,Set(AIFILE=/var/spool/asterisk/monitor/${US})
 same => n,MixMonitor(${AIFILE}.ulaw)
 same => n,System(printf "%s" "${CALLERID(num)}" > /opt/voice-agent/.caller_id/${US}.caller 2>/dev/null)
 same => n,AudioSocket(${US},127.0.0.1:8300)
 same => n,Hangup()

exten => h,1,NoOp(AI post: ${AIFILE})
 same => n,GotoIf($[${LEN(${AIFILE})}=0]?end)
 same => n,GotoIf($[${STAT(F,${AIFILE}.processed)}=1]?end)
 same => n,System(/opt/voice-agent/post.sh ${AIFILE})
 same => n(end),NoOp()

[from-internal-additional-custom]
exten => 2003,1,Goto(ai-hotline,s,1)
